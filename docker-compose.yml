version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: lifebuddy_db
    restart: always
    environment:
      POSTGRES_USER: lifebuddy_user
      POSTGRES_PASSWORD: lifebuddy_secure_password_2026
      POSTGRES_DB: lifebuddy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifebuddy_user -d lifebuddy"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lifebuddy_app
    restart: always
    environment:
      - DATABASE_URL=postgresql://lifebuddy_user:lifebuddy_secure_password_2026@db:5432/lifebuddy
      - LIFEBUDDY_SECRET_KEY=lifebuddy_production_jwt_secret_key_long_string_2026
      - CORS_ORIGINS=*
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
