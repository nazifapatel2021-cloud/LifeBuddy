services:
  - type: web
    name: lifebuddy-app
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && python scripts/seed_demo.py
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: LIFEBUDDY_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
    autoDeploy: true
